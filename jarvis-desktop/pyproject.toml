[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "Double-clap desktop assistant: mic trigger, launch sequence, voice, and a minimalist local UI."
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
build = [
    "pyinstaller>=6.6",
    "elevenlabs>=1.50,<3",
]

[project.scripts]
jarvis-desktop = "jarvis_desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
